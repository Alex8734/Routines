name: Release

# Zwei Wege, einen Release zu bauen:
#  1. Tag pushen:  git tag v1.2.3 && git push origin v1.2.3
#     → baut, signiert und legt ein GitHub-Release mit APK + AAB an.
#  2. Manuell über den Actions-Tab ("Run workflow") mit Versionsangabe
#     → baut die Artefakte, erstellt aber KEIN Release (nur Download in der Run-Übersicht).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsname für den manuellen Build (z. B. 1.2.3)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write # nötig, damit `gh release create` das Release anlegen darf

jobs:
  release:
    runs-on: ubuntu-latest

    # Job-Ebene, nicht Step-Ebene: ein Step kann sein eigenes `env` nicht in
    # seiner eigenen `if`-Bedingung auswerten.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version bestimmen: beim Tag-Push aus dem Tag (v1.2.3 → 1.2.3),
      # beim manuellen Lauf aus der Eingabe. versionCode = fortlaufende Run-Nummer,
      # damit jeder Build eine höhere Nummer hat als der vorige (Play-Store-Regel).
      - name: Version ermitteln
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Baue Version $VERSION (versionCode ${{ github.run_number }})"

      # JDK 17 = dieselbe Version wie lokal; AGP 9.2 setzt mindestens 17 voraus.
      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 36.1 ist auf dem Runner-Image evtl. nicht vorinstalliert;
      # setup-android akzeptiert die Lizenzen, den Rest lädt AGP selbst nach.
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      # Verification Gate: kein Release ohne grüne Unit-Tests.
      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Testergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

      # Keystore aus dem Secret wiederherstellen. Fehlt das Secret, wird der
      # Schritt übersprungen und der Build erzeugt ein unsigniertes APK
      # (siehe signingConfigs in app/build.gradle.kts).
      - name: Keystore entschlüsseln
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Release bauen (APK + AAB)
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Kein Secret: Der Alias ist nicht vertraulich (er steht im Zertifikat
          # jedes signierten APK). Als Secret hinterlegt würde GitHub das Wort
          # "routines" in *allen* Logzeilen durch *** ersetzen — inklusive der
          # Artefaktnamen.
          KEY_ALIAS: routines
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      # Die Gradle-Ausgabenamen (app-release.apk / app-release-unsigned.apk)
      # in etwas Sprechendes umbenennen, das im Release gut aussieht.
      - name: Artefakte einsammeln
        id: artifacts
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.name }}"
          # `|| true`: GitHub führt run-Blöcke mit `bash -e` aus. Fehlt das
          # Ausgabeverzeichnis, bricht `find` mit Exit != 0 ab und der Step
          # stirbt, bevor die verständliche Meldung unten greifen kann.
          APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n1 || true)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then echo "Kein APK gebaut!"; exit 1; fi
          case "$APK" in
            *unsigned*) SUFFIX="-unsigned" ;;
            *)          SUFFIX="" ;;
          esac
          cp "$APK" "dist/routines-$V$SUFFIX.apk"
          [ -n "$AAB" ] && cp "$AAB" "dist/routines-$V.aab"
          echo "unsigned=$SUFFIX" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: routines-${{ steps.version.outputs.name }}
          path: dist/
          retention-days: 90

      # Nur beim Tag-Push: GitHub-Release anlegen. `gh` ist auf dem Runner
      # vorinstalliert — keine zusätzliche Action nötig.
      - name: GitHub-Release anlegen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=""
          if [ -n "${{ steps.artifacts.outputs.unsigned }}" ]; then
            NOTE=$'\n\n> ⚠️ Unsigniert gebaut — es waren keine Keystore-Secrets hinterlegt.'
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Routines ${{ steps.version.outputs.name }}" \
            --notes "Automatischer Build aus Tag \`$GITHUB_REF_NAME\` (versionCode ${{ steps.version.outputs.code }}).$NOTE"
